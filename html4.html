<body>

<p class="title">My Daily Plan</p>
<h1 class="subtitle">오늘의 할 일</h1>
<h2>Schedule</h2>

</div>

<div class="todaytable">
<span class="today">TODAY</span>

<main>
<section class="focus">
<div>
<p class="new">what's new</p>
<h2>Daily Plan</h2>

</div>

<div class="focused" aria-hidden="true">

</div>
</section>

<section class="grid" aria-table="오늘의 현황">

<span class="gridtitle">total</span>
<strong id="total">0</strong>

</article>

<span class="gridtitle">finish</span>
<strong id="finish">0</strong>

</article>

<article class="gridtable">
<div class="progress">
<span class="gridtitle">process</span>
<strong id="process">0%</strong>
</div>
</article>

<div 
class="progresstable"
role="progresstitle"
aria-table="progress"
aria-valuemin="0"
aria-valuemax="100"
aria-valuenow="0">
<div id="prfine" class="prfine">
</div>
</div>


<div>
</div>

</main>
